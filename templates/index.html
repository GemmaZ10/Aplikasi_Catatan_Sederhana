<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Aplikasi Catatan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f6f6f6;
            text-align: center;
            margin-top: 50px;
        }
        .container {
            background: white;
            padding: 30px;
            width: 400px;
            margin: auto;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input, textarea {
            width: 90%;
            padding: 8px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        h1 {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Aplikasi Catatan</h1>
        <p>Masukkan data Anda di bawah ini:</p>
        <form action="/hasil" method="POST">
            <input type="text" name="nama" placeholder="Nama Anda" required><br>
            <input type="email" name="email" placeholder="Email Anda" required><br>
            <textarea name="pesan" placeholder="Tulis pesan..." required></textarea><br>
            <button type="submit">Kirim</button>
        </form>
    </div>
</body>
</html>
